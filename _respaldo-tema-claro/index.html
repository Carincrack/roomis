<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E6F4EC" />
  <title>Roomies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet" />


  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config/tailwind-config.js"></script>

  <!-- Componentes con @apply: el CDN de Tailwind solo procesa este bloque en línea -->
  <style type="text/tailwindcss">
    @layer base {
      html { -webkit-tap-highlight-color: transparent; }
      body { font-variation-settings: "opsz" 14; }
      input, button, select, textarea { font: inherit; color: inherit; }
      ::selection { background: rgba(11,122,90,.2); }
    }
    @layer components {
      /* Superficies de vidrio */
      .vidrio        { @apply border border-texto/[0.14] bg-white/[0.6] shadow-vidrio backdrop-blur-[12px]; }
      .vidrio-fuerte { @apply border border-texto/[0.14] bg-white/[0.7] shadow-vidrio backdrop-blur-[12px]; }
      .tarjeta       { @apply border border-texto/[0.14] bg-white/[0.6]; }

      /* Tipografía */
      .h1    { @apply font-serif text-[30px] font-medium leading-9 tracking-[-0.15px]; }
      .h2    { @apply font-serif text-[24px] font-medium leading-[30px] tracking-[-0.12px]; }
      .h3    { @apply font-serif text-[19px] font-medium leading-6; }
      .micro { @apply text-[11px] font-medium uppercase leading-[14px] tracking-[0.22px]; }
      .tenue { @apply text-texto/70; }
      .sec   { @apply text-texto/85; }

      /* Botones */
      .btn-icono   { @apply grid size-11 shrink-0 place-items-center rounded-full border border-texto/[0.14] bg-white/[0.7] text-texto transition hover:bg-white/[0.9] active:scale-95; }
      .btn-primario{ @apply flex h-[54px] w-full items-center justify-center gap-2.5 rounded-[27px] border border-white/60 bg-gradient-to-r from-acento-claro to-acento-teal px-6 text-[16px] font-semibold leading-5 text-sobre shadow-brillo transition hover:brightness-105 active:scale-[0.98] disabled:pointer-events-none disabled:opacity-45; }
      .btn-vidrio  { @apply flex h-[54px] w-full items-center justify-center gap-2.5 rounded-[27px] border border-texto/[0.14] bg-white/[0.7] px-6 text-[16px] font-semibold leading-5 text-texto shadow-vidrio backdrop-blur-[12px] transition hover:bg-white/[0.85] active:scale-[0.98]; }
      .btn-sec     { @apply flex min-h-11 items-center justify-center gap-1.5 rounded-[14px] border border-texto/[0.16] bg-white/[0.65] px-3.5 py-2.5 text-[12px] font-medium leading-4 text-texto transition hover:bg-white/[0.8] active:scale-[0.98]; }
      .btn-acento  { @apply flex min-h-11 items-center justify-center gap-1.5 rounded-[14px] bg-gradient-to-r from-acento-claro to-acento-teal px-3.5 py-2.5 text-[12px] font-medium leading-4 text-sobre transition hover:brightness-105 active:scale-[0.98]; }
      .chip        { @apply flex min-h-10 shrink-0 items-center gap-1.5 rounded-[18px] border border-texto/[0.14] bg-white/[0.6] px-3 py-[9px] text-[12px] font-medium leading-4 text-texto/70 transition hover:bg-white/[0.75]; }
      .chip-activo { @apply border-transparent bg-gradient-to-r from-acento-claro to-acento-teal text-sobre hover:bg-transparent; }

      /* Piezas */
      .burbuja { @apply grid shrink-0 place-items-center rounded-full border border-acento-tea/25 bg-acento-teal/[0.18] text-acento-tea; }
      .avatar  { @apply grid shrink-0 place-items-center rounded-full border-[1.5px] border-white font-semibold leading-4 text-texto; }
      .divisor { @apply h-px w-full bg-texto/10; }
      .campo   { @apply flex items-center gap-3 rounded-2xl border border-texto/[0.14] bg-white/[0.6] px-4 py-[15px] transition focus-within:border-[1.5px] focus-within:border-acento-teal; }
      .anillo  { @apply focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-acento-tea focus-visible:ring-offset-2 focus-visible:ring-offset-fondo-mid; }
    }
    @layer utilities {
      .pt-seguro { padding-top: max(12px, env(safe-area-inset-top)); }
      .pb-seguro { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      .sin-scroll::-webkit-scrollbar { display: none; }
      .sin-scroll { scrollbar-width: none; }
    }
  </style>
  <link rel="stylesheet" href="css/estilos.css" />
</head>

<body class="min-h-[100dvh] bg-fondo-bottom font-sans text-texto antialiased">

  <!-- Fondo fijo: gradiente + brillos (Roomies/Fondo/Gradiente) -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden bg-gradient-to-b from-fondo-top via-fondo-mid via-[55%] to-fondo-bottom">
  
    <div class="absolute right-[-30%] top-[-14%] aspect-square w-[80vw] max-w-[620px] rounded-full bg-[#BFE6D2]/50 blur-[100px] md:right-[-6%] md:blur-[140px]"></div>
    <div class="absolute bottom-[-20%] left-[-35%] aspect-square w-[75vw] max-w-[560px] rounded-full bg-[#D5E8F7]/60 blur-[110px] md:left-[-8%] md:blur-[150px]"></div>
  </div>

  <!-- Barra lateral (escritorio) -->
  <aside id="lateral" aria-label="Navegación principal"
         class="fixed inset-y-0 left-0 z-30 hidden w-[88px] flex-col gap-5 border-r border-texto/[0.08] bg-white/[0.4] p-3 backdrop-blur-[12px] lg:w-[264px] lg:gap-6 lg:p-6"></aside>

  <!-- Vista actual -->
  <main id="app" class="relative min-h-[100dvh]"></main>

  <!-- Barra inferior (móvil y tablet) -->
  <nav id="barra" aria-label="Navegación principal"
       class="fixed inset-x-4 bottom-[max(16px,env(safe-area-inset-bottom))] z-30 mx-auto hidden h-[72px] max-w-[420px] items-center justify-between rounded-[28px] border border-texto/[0.14] bg-[rgba(255,255,255,0.94)] px-2.5 shadow-vidrio backdrop-blur-[16px] md:!hidden"></nav>

  <div id="capa-modal"></div>
  <div id="aviso" role="status" aria-live="polite"
       class="pointer-events-none fixed inset-x-4 bottom-[104px] z-50 mx-auto flex w-fit max-w-[calc(100%-2rem)] translate-y-3 items-center gap-2.5 rounded-[20px] border border-acento-teal bg-[#FFFFFF] px-4 py-3 opacity-0 shadow-vidrio backdrop-blur-[12px] transition duration-300 md:bottom-8 md:left-[88px] lg:left-[264px]"></div>

</body>
